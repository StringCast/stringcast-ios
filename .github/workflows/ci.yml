name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & test (macOS)
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme StringCast -destination 'generic/platform=iOS Simulator' build
